<!DOCTYPE html>
<html>
<head>
  <title>EV Circuit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<video autoplay muted loop id="bg-video">
  <source src="vehicleev.mp4" type="video/mp4">
</video>

<header>
  <h1>EV CIRCUIT</h1>
</header>

<div class="login">
  <h2>Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <button onclick="login()">Login</button>
</div>

<section id="home">
  <h1>Welcome</h1>
  <p>Smart EV charging made simple.</p>
</section>

<section id="about">
  <h1>About Us</h1>
  <p>Find Nearby Fast,Reliable EV Charging Stations Everywhere.</p>
</section>

<section id="contact">
  <h1>Contact</h1>
  <form>
    <input type="text" placeholder="Full Name">
    <input type="email" placeholder="Email">
    <textarea placeholder="Message"></textarea>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
  </form>
</section>

<footer>© 2026 EV CIRCUIT</footer>

<script src="script.js"></script>
</body>
</html>
